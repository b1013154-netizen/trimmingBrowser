<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>操作バー</title>
<link rel="stylesheet" href="bar.css">
</head>
<body>
<div class="bar" id="pending">
  <span class="msg">見たい部分が映ったら</span>
  <button class="b primary" data-act="select">✂ 範囲を選ぶ</button>
  <button class="i" data-act="close" title="この窓を閉じる">✕</button>
</div>
<div class="bar" id="trimmed" hidden>
  <div class="grip" id="grip" title="ドラッグで移動">⠿</div>
  <button class="i" data-act="select" title="範囲・図形を選び直す">✂</button>
  <button class="i tg" data-act="topmost" id="topmost" title="常に最前面">📌</button>
  <label class="op" title="不透明度"><span>◐</span><input type="range" min="20" max="100" step="5" id="opacity"><span class="v" id="opv"></span></label>
  <button class="i tg" data-act="clickThrough" id="click" title="クリック透過（下の画面を操作できるようにする）">🖱</button>
  <button class="i" data-act="favorite" id="fav" title="お気に入りに保存（ページ・範囲・位置を覚える）">★</button>
  <button class="i" data-act="restore" title="切り出しをやめて元の窓に戻す">⤺</button>
  <button class="i" data-act="menu" title="その他">⋯</button>
  <button class="i x" data-act="close" title="閉じる">✕</button>
</div>
<script src="bar.js"></script>
</body>
</html>
