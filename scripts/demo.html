<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>デモ動画サイト</title>
<style>
body{margin:0;font-family:"Noto Sans JP",sans-serif;background:#0f0f0f;color:#eee}
header{height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#202020}
.logo{color:#f33;font-weight:800;font-size:20px}.search{flex:1;max-width:520px;height:34px;border-radius:17px;background:#121212;border:1px solid #333}
main{display:flex;gap:20px;padding:20px}
.player{flex:1;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#1d4e89,#3aa17e 60%,#f2c14e);position:relative;overflow:hidden}
.player::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:80px;color:rgba(255,255,255,.85)}
.player .bar{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
aside{width:260px;display:flex;flex-direction:column;gap:12px}aside div{height:70px;border-radius:8px;background:#272727}
h2{margin:12px 20px;font-size:18px}
</style></head>
<body><header><span class="logo">▶ DemoTube</span><div class="search"></div></header>
<main><div><div class="player" style="width:640px"><div class="bar"></div></div><h2>おすすめの動画タイトル</h2></div><aside><div></div><div></div><div></div><div></div></aside></main>
</body></html>
